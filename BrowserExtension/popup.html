<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>SnapDrive Capture</title><link rel="stylesheet" href="ui.css"><link rel="stylesheet" href="popup.css"></head>
<body>
<main>
  <header class="top">
    <div class="brand"><span class="brand-mark"><svg aria-hidden="true"><use href="icons/interface.svg#brand"/></svg></span><div><strong>SnapDrive</strong><small>Browser capture</small></div></div>
    <button class="icon-only" id="settings" type="button" aria-label="Capture settings" aria-controls="setup" aria-expanded="false" title="Capture settings"><svg aria-hidden="true"><use href="icons/interface.svg#sliders"/></svg></button>
  </header>
  <section class="capture" aria-labelledby="capture-title">
    <h1 id="capture-title">What are you capturing?</h1>
    <div class="modes">
      <button type="button" data-mode="region"><span class="tile lilac"><svg aria-hidden="true"><use href="icons/interface.svg#region"/></svg></span><span class="label"><strong>Selected area</strong><small>Drag to frame a part</small></span><svg class="next" aria-hidden="true"><use href="icons/interface.svg#right"/></svg></button>
      <button type="button" data-mode="visible"><span class="tile mint"><svg aria-hidden="true"><use href="icons/interface.svg#visible"/></svg></span><span class="label"><strong>Visible tab</strong><small>Capture what you see</small></span><svg class="next" aria-hidden="true"><use href="icons/interface.svg#right"/></svg></button>
      <button type="button" data-mode="full"><span class="tile apricot"><svg aria-hidden="true"><use href="icons/interface.svg#full"/></svg></span><span class="label"><strong>Full page</strong><small>Include content below the fold</small></span><svg class="next" aria-hidden="true"><use href="icons/interface.svg#right"/></svg></button>
    </div>
  </section>
  <section id="setup" hidden aria-label="Capture settings">
    <label class="resolution"><span>Full-page quality</span><select id="resolution"><option value="native">Native pixels</option><option value="1x">1× smaller</option></select></label>
    <button type="button" class="link" id="shortcuts">Manage keyboard shortcuts</button>
    <p class="help">Mac connection: <strong>Image › Browser Extension…</strong></p>
  </section>
  <p id="status" class="status" role="status" aria-live="polite" hidden></p>
  <button id="cancel" type="button" class="control" hidden>Cancel capture</button>
  <footer><button id="latest" class="link" type="button" disabled><svg aria-hidden="true"><use href="icons/interface.svg#clock"/></svg> Latest capture</button><span class="local"><i></i> On this device</span></footer>
</main>
<script src="capture-store.js"></script><script src="popup.js"></script>
</body></html>
