<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <link rel="stylesheet" href="popup.css">
  <title>Sanju’s SnapDrive</title>
</head>
<body>
<main>
  <header>
    <img src="icons/icon32.png" width="30" height="30" alt="">
    <strong>Sanju’s SnapDrive</strong>
    <span class="badge">PNG</span>
  </header>
  <div class="modes" aria-label="Screenshot capture">
    <button type="button" data-mode="full" class="primary" aria-label="Capture full page">
      <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="5" y="2" width="14" height="20" rx="2"/><path d="M9 7h6M9 11h6M9 15h4"/></svg>
      <span>Full page</span>
      <svg class="next" viewBox="0 0 24 24" aria-hidden="true"><path d="m9 6 6 6-6 6"/></svg>
    </button>
    <button type="button" data-mode="visible" aria-label="Capture visible area">
      <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M3 9h18"/></svg>
      <span>Visible area</span>
      <svg class="next" viewBox="0 0 24 24" aria-hidden="true"><path d="m9 6 6 6-6 6"/></svg>
    </button>
    <button type="button" data-mode="region" aria-label="Capture selected area">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 3H5a2 2 0 0 0-2 2v3m13-5h3a2 2 0 0 1 2 2v3M3 16v3a2 2 0 0 0 2 2h3m8 0h3a2 2 0 0 0 2-2v-3"/><rect x="8" y="8" width="8" height="8" rx="1"/></svg>
      <span>Selected area</span>
      <svg class="next" viewBox="0 0 24 24" aria-hidden="true"><path d="m9 6 6 6-6 6"/></svg>
    </button>
  </div>
  <label class="resolution" for="resolution">
    <span>Quality</span>
    <select id="resolution" aria-label="Full-page resolution">
      <option value="native">Retina · native</option>
      <option value="1x">1× · smaller</option>
    </select>
  </label>
  <button id="cancel" class="cancel" type="button" hidden>Cancel capture</button>
  <div id="status" role="status" aria-live="polite">Ready to capture</div>
  <details id="setup">
    <summary>Connection help</summary>
    <p>In the Mac app, open <b>Image → Browser Extension…</b> to connect.</p>
    <p>Keep the captured tab open until finished.</p>
  </details>
</main>
<script src="popup.js"></script>
</body>
</html>
